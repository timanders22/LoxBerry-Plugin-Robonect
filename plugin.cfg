[AUTHOR]
NAME=Robonect Plugin Authors
EMAIL=robonect@users.noreply.github.com

[PLUGIN]
VERSION=1.0.11
NAME=robonect
FOLDER=robonect
TITLE=Rasenmaeher (Robonect)

[AUTOUPDATE]
# Automatische Updates ueber GitHub (release.cfg im Repository).
# Bei einem neuen Release: VERSION hier und in release.cfg erhoehen,
# Tag vX.Y.Z anlegen - installierte LoxBerrys ziehen dann automatisch nach.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Robonect/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Robonect/main/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
