B_S1 = "Inputs as on the page “Robonect” (step 3 above). The plugin only counts the values no. 8–11 with the tick “{L:TEXT.STAT_EIN}” in the tab “{L:REITER.EINSTELLUNGEN}” (off by default); without it they send -1, and the status no. 12 says so."
B_S2 = "Create a new page “Robonect Steuerung”. Drag the inputs no. 1, 2, 4–6, 8–11 and 49 ({N:maeht} a second time – it is also on the page “Robonect”). At the output “LoxBerry MQTT-Gateway” create the commands no. 14, 16, 18, 29 and 32 (name and command as in the table); each command appears only once in the project."
B_S3 = "Create virtual inputs (Periphery → Virtual inputs, “Use in visualisation” on): push buttons (input type push button) no. 13, 15, 17, 27 and 30; switches (input type switch) no. 19, 22, 24, 37 and 51; no. 35 as virtual input (analog); no. 41 as slider (Min 0, Max 480, step 10). A virtual input has no start value – that is why the formula no. 42 counts “0 or no value” as 2 hours."
B_S4 = "Own sources: connect your rain sensor (Loxone weather station, rain sensor on a digital input, Ecowitt via the Ecowitt-Weiche with a threshold switch on the rain rate) to no. 20 and to no. 33 V2 and delete the switch no. 19; without a rain sensor no. 19 stays as a manual “it is raining” switch. Outdoor temperature to no. 36 and no. 33 V8 instead of no. 35, “irrigation running” to no. 38 instead of no. 37. Only switch on “Frostsperre an” (no. 51) with your own outdoor temperature – without a source no. 35 stays at 0 °C. Schedule no. 21: double-click, ON times as in the table; the holidays come from the Loxone calendar (operating modes)."
B_S5 = "Place the other blocks (F5) and connect from top to bottom: off-delay no. 20 (time from no. 42 at Doff) and no. 38 (1800 s), threshold switch no. 36, formula no. 42, eight OR, four AND, edge detection no. 26 (Pd 1 s), RS flipflop no. 44 (remanence on), pulse at no. 46 (00:05), status lines as given. An OR has only two inputs: the lock reasons run through no. 23, 34, 39 and 40. Connect output AQ of the schedule no. 21 to no. 23 I2 and to no. 33 V4. On the status no. 33 the inputs from V5 only appear after a click on the “+”."
B_S6 = "Save in Config and transfer. Switch on “Sperr-Automatik ein” in the app."
B_S7 = "Check: switch on “Regensensor (eigene Quelle)” in the app → the mower gets “Ende des Tages” and goes home, “Sperre jetzt” shows “locked: it is raining”. Off again → “lawn drying”, after the drying time (2 h by default) “Automatik”. Both commands appear in the plugin tab “{L:REITER.LOG}” (“über MQTT”)."
ERLAEUTERUNG = "<b>On the inputs and commands:</b> The names appear here exactly as the MQTT gateway assigns them for mower 1 (prefix from the tab “{L:REITER.MQTT}”). For a further mower its number follows the prefix (e.g. {N:2/code}); its commands are called {P}/befehl/2/… ."
H_ANHALTEN = "“Mähen anhalten” leaves the mower where it is; “Feierabend” or “Mäher heim” (page “Robonect”) sends it home."
H_ANZEIGE = "Temperature and Wi-Fi are for display only – the plugin has no warning threshold for them. Unknown is -999 there, because -1 °C and -1 dBm would be valid readings."
H_AWV = "The analog value validation gets the constant 1 at En; if the sign of life {N:status/zaehler} stands still for longer than Tmc, its output E reports. Config creates input En inverted (tick at ‘En’ in the properties under Parameters). Remove this tick, otherwise constant 1 arrives as 0 and the failure message never triggers."
H_BEFEHLE = "Commands only work with the tick “{L:BEFEHL.HAKEN_EIN}”, driving commands also with “{L:BEFEHL.HAKEN_STEUERN}” (tab “{L:REITER.MQTT}”). The status no. 50 shows whether the command service runs. The plugin does not accept the same driving command again at once: start and stop 10 s, modes 60 s."
H_DOPPELT = "Avoid duplicate notifications: if you use no. 25 and no. 38, untick “{L:TEXT.MESSERWECHSEL_FLLIG}” and “{L:TEXT.AKKU_UNTER_20_AUERHALB_DER_STATION}” in the plugin; “Push Rasenmäher” (no. 11) then still reports faults and “{L:TEXT.MHEN_BEENDET}”."
H_FROST = "Frost only locks with the switch “Frostsperre an” (no. 51, off by default): without your own outdoor temperature at no. 35 it would read 0 °C, and the lock would hold all the time."
H_HEIM = "Mäher heim is a push button in the app and sends the command “Robonect: zur Ladestation”."
H_MESSER = "Press “Messer gewechselt” only after the change – the command sets the hours left back to the interval (200 h by default, can be changed in the plugin tab “{L:REITER.EINSTELLUNGEN}”). The mower must be reachable and report its operating hours."
H_MINUS1 = "-1 means “unknown”: the mower does not answer or did not deliver the field. Therefore leave the inputs analog."
H_MITTERNACHT = "“Ende des Tages” only holds until midnight. If the lock still holds at 00:05 (quiet time on Sunday, rain at night), it goes out once more (no. 46–48)."
H_ODER = "All faults go through OR into one notification; a notification block gets only one source."
H_PUSH = "Push Rasenmäher only sends when the notification window is active AND the push is enabled (the plugin sets both)."
H_SCHLEIFE = "The loop signal notification (no. 35) only comes when state 8 lasts longer than 120 s (no. 43) – a short dropout while docking does not report."
H_SPERREN = "Each lock (rain and the drying time afterwards, quiet time, irrigation and 30 minutes afterwards, frost with “Frostsperre an”, by hand) sends “Ende des Tages” once when it begins. At its end “Automatik” only comes if the lock had sent the mower home and nobody has pressed “Feierabend” or “Mähen anhalten” since (no. 43–45). “Automatik” or “Mähen starten” by hand during a lock stays allowed – hand comes first."
H_STATISTIK = "The mowing statistics show “usage statistics off”, as long as the tick “{L:TEXT.STAT_EIN}” is missing in the plugin – the four values are -1 then."
H_TITEL = "Notes"
H_WINTER = "In winter switch off “Sperr-Automatik ein” – otherwise the “Automatik” at 7 am wakes the mower in its winter storage if the lock had sent it home."
H_ZEITEN = "Drying time (no. 41, in the app; 0 = 2 hours), drying after the irrigation (no. 38) and quiet times (no. 21) are suggestions – change them to your own experience and local bylaws. The schedule times are the usual rule for residential areas, not legal advice."
