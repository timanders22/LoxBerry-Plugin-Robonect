EB_S5_TEXT = "Commands go as <span class='sm-mono'>publish</span> to the UDP input of the MQTT gateway; the command service of the plugin executes them and acknowledges on <span class='sm-mono'>…/quittung</span>. They only work with the tick “Accept commands via MQTT” in the tab “MQTT”; driving commands also need “Control the mower via MQTT”. Nothing needs to be entered for commands under gateway V1 and V2."
EB_S5_VORLAGE = "The template creates its own virtual output “Rasenmäher MQTT-Befehle” (UDP to the gateway). The sample project uses the shared output “LoxBerry MQTT-Gateway” with the commands “Robonect: …” instead – both work the same; add only one of the two per command."
