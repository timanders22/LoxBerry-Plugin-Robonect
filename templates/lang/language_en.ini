EB_S4 = "Step 4: failure detection"
EB_S4_TEXT = "A virtual input <b>keeps its last value</b> when nothing arrives any more — in the app everything looks normal then. That is why the plugin sends the sign of life %s every minute (counts 0 to 999 and wraps). Connect this input to an analog value validation: Tmc 600 s, Min 0, Max 999, constant 1 at En, and remove the tick at ‘En’ in the properties. If the LoxBerry, the minute run or the MQTT gateway stands still, its output E reports. %s on a NOT reports when the mower does not answer. An age computed from a timestamp is not needed."
