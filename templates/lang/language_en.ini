WAS_IST_DAS = "<b>Robotic mower with Robonect module (HX/Hx+) on the Loxone Miniserver – without a password in the project file.</b> The plugin keeps the mower credentials on the LoxBerry and polls state, battery, mode, operating hours, blades, temperature and Wi-Fi every minute (cron, no service of its own). The values go over MQTT to the MQTT gateway and from there to virtual inputs on the Miniserver; commands such as start, stop or mode are taken over MQTT by the command bridge (two ticks in the MQTT tab, off by default). The HTTP path with action token stays for existing installations. Faults, end of mowing and a due blade change are reported to Loxone, and announced on request."
