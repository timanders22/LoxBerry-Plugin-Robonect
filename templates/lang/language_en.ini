P_VO = "Address %s, without user and password. Quickest with the button <i>%s</i> above – it also creates the commands of the next row including the action token."
P_VO_BEFEHL = "%s commands: %s. Command on ON per command as in step 4 (with action token)."
P_VO_EIN = "Command on ON unchanged from the template (%s with action token)"
TEXT = "Work through it from top to bottom and the function is rebuilt. Loxone Config finds the blocks via the block search (<b>F5</b>). {B1} to {B4} are required (quickest via the two template buttons above), everything from {B5} on is a suggestion – the real benefit is the weather and time locks from {B19} on."
