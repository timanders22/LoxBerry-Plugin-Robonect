[BAUSTEIN]
A_S1 = "In the plugin, enter the mower in the tab “{L:REITER.EINSTELLUNGEN}” and save. In the tab “{L:REITER.MQTT}” “{L:TEXT.ZUSTAND_PER_MQTT_VERFFENTLICHEN}” must be ticked (on by default for new installations)."
A_S10 = "Save in Config and transfer to the Miniserver."
A_S2 = "For the commands no. 19 and no. 27 tick “{L:BEFEHL.HAKEN_EIN}” in the tab “{L:REITER.MQTT}”, for no. 19 also “{L:BEFEHL.HAKEN_STEUERN}”, and save – the command service starts at once."
A_S3 = "In Loxone Config create the inputs from step 3 above (Periphery → Virtual inputs → Virtual input, no. 44 as virtual text input), names exactly as in the table – button “{L:TEXT.EB_KOPIEREN}”. Do not tick “Use as digital input”. There is no import template for the values; whoever copies the page from the sample project gets the inputs with it."
A_S4 = "Create a new page “Robonect” and drag the inputs no. 1–7, 20–23, 28–30, 32, 39, 41 and the text input no. 44 from the tree onto the page."
A_S5 = "Create the commands no. 19 and no. 27 at the virtual output “LoxBerry MQTT-Gateway” of the sample project (virtual output command, name and command on ON as in the table, no command on OFF). If you do not have this output, import the template “{L:BEFEHL.K_VORLAGE}” from step 5 instead – the commands are then called “Rasenmäher … (MQTT)”."
A_S6 = "Create two buttons (Periphery → Virtual inputs → Virtual input, input type push button, “Use in visualisation” on): no. 18 “Mäher heim” and no. 26 “Messer gewechselt”."
A_S7 = "Create six notifications (Periphery → Messages → Notification): no. 11, 17, 25, 35, 38 and 40, texts as in the table, and drag them onto the page. Each one gets exactly one line."
A_S8 = "Place the other blocks via the block search (F5), enter the parameters as in the table and connect from top to bottom. Status blocks: lines in the order given, the line without condition last; on the status no. 42 the input V5 only appears after a click on the “+”."
A_S9 = "In the plugin tab “{L:REITER.EINSTELLUNGEN}” tick “{L:TEXT.PUSH_NACHRICHT_AKTIV}” (for no. 11). Then tab “{L:REITER.TEST}” → button “{L:TEXT.TEST_PUSHNACHRICHT}”: within 5 minutes “Test-Push Rasenmäher” must arrive on the phone."
