ERLAEUTERUNG = "<b>On {B1} to {B4}:</b> Titles, addresses and commands appear here exactly as the template buttons create them. Loxone Config creates new objects on import and overwrites nothing – importing twice gives duplicate blocks. For a further mower the same list applies with the templates for that mower (selection above the buttons).<br><b>On {B13} and {B16}:</b> The notification block only sends on a 0→1 edge – never wire several sources directly to the input, always collect them in an OR first ({B12}). Use a separate block for the test.<br><b>On {B17} and {B18}:</b> These two blocks are the most important ones in the whole list. Without them Loxone keeps showing the last measured value when the cron run stalls – and that looks like valid information. The threshold is well above the %s s polling cycle so a single missed run does not trigger an alert. As a cross-check: {F:ZAEHLER} must change every minute.<br><b>On {B19} to {B23}:</b> Rain sensor, timer and the values of the holiday plugin come from your own installation. Both locks send the mower home via {B23} – a command of the virtual output gets only one source. The release after the rain switches back to automatic via {B20}."
N_VORLAGE = "Titles as in the template (Parameters column)"
P_EINHEIT_H = "Unit <span class='sm-mono'>&lt;v.0&gt; h</span>"
