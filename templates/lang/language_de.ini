ERLAEUTERUNG = "<b>Zu {B1} bis {B4}:</b> Titel, Adressen und Befehle stehen hier so, wie die Vorlagen-Knöpfe sie erzeugen. Loxone Config legt beim Import neu an und überschreibt nichts – zweimal eingelesen ergibt doppelte Bausteine. Für einen weiteren Mäher gilt dieselbe Liste mit den Vorlagen für diesen Mäher (Auswahl über den Knöpfen).<br><b>Zu {B13} und {B16}:</b> Der Benachrichtigungs-Baustein sendet nur bei einer 0→1-Flanke – niemals mehrere Quellen direkt an den Eingang legen, immer erst im ODER sammeln ({B12}). Für den Test einen eigenen Baustein verwenden.<br><b>Zu {B17} und {B18}:</b> Diese beiden Bausteine sind die wichtigsten der ganzen Liste. Ohne sie steht in Loxone bei einem stehenden Cron-Lauf weiter der letzte gemessene Wert – und das sieht aus wie eine gültige Auskunft. Die Schwelle liegt deutlich über dem Abholtakt von %s s, damit ein einzelner verpasster Durchlauf keine Meldung auslöst. Zur Gegenprobe: {F:ZAEHLER} muss sich jede Minute ändern.<br><b>Zu {B19} bis {B23}:</b> Regensensor, Zeitschaltuhr und die Werte des Ferien-Plugins kommen aus der eigenen Anlage. Beide Sperren schicken den Mäher über {B23} heim – ein Befehl des virtuellen Ausgangs bekommt nur eine Quelle. Die Freigabe nach dem Regen kommt über {B20} wieder auf Automatik."
