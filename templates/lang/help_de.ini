; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Rasenmäher (Robonect)"
K02 = "Bindet einen Mähroboter mit <b>Robonect-Modul</b> (HX/Hx+) an Loxone an — und nimmt dabei vor allem eines aus der Loxone-Projektdatei heraus: <b>das Passwort</b>."
K03 = "Bisher übliche Praxis ist eine URL wie <code>http://mäher/xml?user=admin&amp;pass=geheim&amp;cmd=status</code> direkt im virtuellen Eingang. Damit steht das Klartext-Passwort in der Projektdatei, in jedem Backup und in jeder Datei, die man zur Fehlersuche weitergibt. Dieses Plugin hält die Zugangsdaten lokal (Dateirechte 0600, HTTP-Basic-Auth) — Loxone ruft nur noch <code>http://loxberry/plugins/robonect/mower.php</code> auf."
K04 = "Kompatibel mit LoxBerry 3.x und <b>LoxBerry 4</b> (reines PHP, PHP 7.4 und 8.x)."
K05 = "Funktionen"
K06 = "Status als <b>Zahl</b> (parkt, mäht, sucht Ladestation, lädt, Fehler, Schleifensignal verloren, abgeschaltet, schläft) plus Klartext"
K07 = "Betriebsart, Akku, Fehlercode und Fehlertext, Betriebsstunden, Laufzeit des aktuellen Einsatzes, Temperatur und Feuchte im Modul, WLAN-Signal"
K08 = "<b>Messerwechsel-Überwachung</b>: Intervall in Betriebsstunden, Restlaufzeit, Warnung — Quittieren per Knopf oder <code>?cmd=blade_reset</code>"
K09 = "<b>Steuerung</b> per einfachem GET: <code>auto</code>, <code>man</code>, <code>home</code>, <code>eod</code>, <code>start</code>, <code>stop</code>"
K10 = "<b>Meldungen</b> als Ansage (TTS) und/oder Push: Störung, Schleifensignal verloren, Mähen beendet, Messerwechsel fällig, Akku unter 20 %"
K11 = "Bis zu <b>2 Mäher</b>, MQTT, JSON, Protokoll (Passwörter werden maskiert)"
K12 = "Reiter: Einstellungen, Einbindung in Loxone (mit kompletter Baustein-Liste inkl. Regen- und Ruhezeitensperre), Test, Protokoll"
K13 = "Endpunkte"
K14 = "Sicherheit"
K15 = "Zugangsdaten ausschließlich in <code>config/plugins/robonect/mower.json</code> (Dateirechte 0600), Übertragung per HTTP-Basic-Auth statt in der URL"
K16 = "Das Passwortfeld zeigt den gespeicherten Wert nie an; leer lassen behält ihn"
K17 = "Vor dem Schreiben ins Protokoll werden Passwörter maskiert"
K18 = "<b>Keine personenbezogenen Daten</b> im Plugin selbst"
K19 = "Aufruf"
K20 = "Zweck"
K21 = "<code>/plugins/robonect/mower.php</code>"
K22 = "Loxone-Zeile <code>MOWER;OK=..;CODE=..;BATT=..;STUNDEN=..;MESSER=..;…</code>"
K23 = "<code>/plugins/robonect/mower.php?debug=1</code>"
K24 = "Klartext-Übersicht"
K25 = "<code>/plugins/robonect/mower.php?json=1</code>"
K26 = "kompletter Zustand als JSON"
K27 = "<code>/plugins/robonect/mower.php?cmd=auto</code>"
K28 = "Automatik (auch <code>man</code>, <code>home</code>, <code>eod</code>, <code>start</code>, <code>stop</code>)"
K29 = "<code>/plugins/robonect/mower.php?cmd=blade_reset</code>"
K30 = "Messerwechsel quittieren"
