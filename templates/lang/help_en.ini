; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Lawn mower (Robonect)"
K02 = "Connects a robotic mower with a <b>Robonect module</b> (HX/Hx+) to Loxone — and in doing so takes one thing above all out of the Loxone project file: <b>the password</b>."
K03 = "The usual practice so far is a URL such as <code>http://mower/xml?user=admin&amp;pass=secret&amp;cmd=status</code> straight in the virtual input. That puts the plain-text password in the project file, in every backup and in every file handed on for troubleshooting. This plugin keeps the credentials locally (file permissions 0600, HTTP basic auth) — Loxone only calls <code>http://loxberry/plugins/robonect/mower.php</code>."
K04 = "Compatible with LoxBerry 3.x and <b>LoxBerry 4</b> (pure PHP, PHP 7.4 and 8.x)."
K05 = "Features"
K06 = "State as a <b>number</b> (parked, mowing, searching for the charging station, charging, error, loop signal lost, switched off, sleeping) plus plain text"
K07 = "Operating mode, battery, error code and error text, operating hours, runtime of the current job, temperature and humidity inside the module, Wi-Fi signal"
K08 = "<b>Blade change monitoring</b>: interval in operating hours, remaining runtime, warning — acknowledge by button or <code>?cmd=blade_reset</code>"
K09 = "<b>Control</b> by a simple GET: <code>auto</code>, <code>man</code>, <code>home</code>, <code>eod</code>, <code>start</code>, <code>stop</code>"
K10 = "<b>Messages</b> as an announcement (TTS) and/or push: fault, loop signal lost, mowing finished, blade change due, battery below 20 %"
K11 = "Up to <b>9 mowers</b>, MQTT, JSON, log (passwords are masked)"
K12 = "Tabs: Settings, MQTT, Loxone integration (with a complete block list incl. rain and quiet-hour locks), Test, Log files"
K13 = "Endpoints"
K14 = "Security"
K15 = "Credentials in <code>config/plugins/robonect/mower.json</code> and in the second copy <code>robonect.backup.json</code> next to it (file mode 0600), sent via HTTP basic auth instead of in the URL. The second copy survives an update; on a new installation <code>preinstall.sh</code> moves it to <code>.alt</code>, uninstalling removes both"
K16 = "The password field never shows the stored value; leaving it empty keeps it"
K17 = "Passwords are masked before anything is written to the log"
K18 = "<b>No personal data</b> in the plugin itself"
K19 = "Call"
K20 = "Purpose"
K21 = "<code>/plugins/robonect/mower.php</code>"
K22 = "Loxone line <code>MOWER;OK=..;CODE=..;BATT=..;STUNDEN=..;MESSER=..;…;TS=..;ZAEHLER=..</code>"
K23 = "<code>/plugins/robonect/mower.php?debug=1</code>"
K24 = "Plain-text overview"
K25 = "<code>/plugins/robonect/mower.php?json=1</code>"
K26 = "complete state as JSON"
K27 = "<code>/plugins/robonect/mower.php?cmd=auto&amp;token=…</code>"
K28 = "Automatic mode (also <code>man</code>, <code>home</code>, <code>eod</code>, <code>start</code>, <code>stop</code>)"
K29 = "<code>/plugins/robonect/mower.php?cmd=blade_reset&amp;token=…</code>"
K30 = "Acknowledge blade change"
K31 = "Heartbeat — why it is needed"
K32 = "A virtual input <b>keeps its last value</b>. If the minutely cron run fails, Loxone keeps showing “parked, battery 80 %” — that is not missing information but a false statement, and it looks like a correct one. That is why the plugin also supplies:"
K33 = "<code>TS</code> — timestamp of the last run in Unix seconds. Age = (Loxone time + 1230768000) − TS"
K34 = "<code>ZAEHLER</code> — wraps 0…999. If it stops, the cron run has stopped — independent of any clock (a Raspberry without a real-time clock jumps at the first time sync)"
K35 = "<code>FEHLERALTER</code> — hours since the last recorded fault, −1 = none known"
K36 = "Via MQTT additionally <code>&lt;prefix&gt;/status/ts</code>, <code>/status/zaehler</code> and <code>/status/ok</code> for the whole installation"
K37 = "Backing up and restoring settings"
K38 = "Two buttons in the Settings tab, intended for <b>moving to a second LoxBerry</b>. The file also contains <b>the action token and the mower credentials</b> — without them all fields would look right after restoring and the plugin still would not reach the installation. Treat the file like a password. On import it is all or nothing: a partially valid file changes <b>nothing at all</b>, and all objections are reported together."
K39 = "<code>/plugins/robonect/mower.php?selftest=1&amp;token=…</code>"
K40 = "checks the token without triggering anything"
K41 = "<code>/plugins/robonect/mower.php?cmd=…&amp;probe=1&amp;token=…</code>"
K42 = "dry run — reports what <i>would</i> be sent, and does not send"
K43 = "<code>/plugins/robonect/mower.php?roh=version&amp;token=…</code>"
K44 = "raw response of the module to a read command (only read commands are allowed)"
K45 = "Every triggering call requires the <b>action token</b>; every form in the interface carries a marker against forged senders"
K46 = "Announcements also via <b>Alexa-NG</b> on Echo devices (<a href='https://github.com/timanders22/LoxBerry-Plugin-Alexa-NG' target='_blank'>LoxBerry-Plugin-Alexa-NG</a>, not selected by default); button “Speak test announcement” in the tab Test"
K47 = "<b>Same-value lock</b>: the same mode within 60 s is not sent to the mower again (<code>UNVERAENDERT=1</code>); <code>start</code>/<code>stop</code> always. A failed command names the <code>GRUND</code>"
